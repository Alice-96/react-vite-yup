name: Test Workflow Permissions

on:
  pull_request:
    branches: [main]

jobs:
  test-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧪 **Test Comment from GitHub Actions**\n\nThis is a test to verify that the workflow has permission to comment on PRs.\n\nTimestamp: ' + new Date().toISOString()
            });